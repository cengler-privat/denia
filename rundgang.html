<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<div id="panorama" style="width: 100%; height: 800px; background: #000;"></div>

<script>
const myViewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "terrasse",
        "author": "Casa Englers y Amigos",
        "sceneFadeDuration": 1200,
        "autoLoad": true,
        "autoRotate": -2, // Optionale langsame Drehung für mehr Dynamik
        "compass": true,
        "northOffset": -67,
        //"hotSpotDebug": true // HILFE: Klicke im Browser ins Bild, um Pitch/Yaw in der Konsole zu sehen!
    },

    "scenes": {
        "terrasse": {
            "title": "Terrasse",
            "type": "equirectangular",
            "panorama": "images/rundgang_terrasse.jpg",
            "hotSpots": [
                {
                pitch: -5.40,
                yaw: 112.30,
                type: "info",
                text: "Eingangsbereich / Rezeption",
                cssClass: "custom-hotspot pulse-effect" // Eigene CSS-Klasse
                },            
                {
                    "pitch": -6,
                    "yaw": -140,
                    "type": "scene",
                    "text": "Ins Wohnzimmer gehen",
                    "sceneId": "wohnzimmer",
                }
            ]
        },

        "wohnzimmer": {
            "title": "Wohnzimmer",
            "type": "equirectangular",
            "panorama": "images/rundgang_wohnzimmer.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 0,
                    "type": "scene",
                    "text": "Zurück zur Terrasse",
                    "sceneId": "terrasse"
                },
                {
                    "pitch": -3.8,
                    "yaw": -30,
                    "type": "scene",
                    "text": "Zum Schlafzimmer",
                    "sceneId": "schlafzimmer"
                },
                {
                    "pitch": 1.10,
                    "yaw": -87,
                    "type": "scene",
                    "text": "Zum Kinderzimmer",
                    "sceneId": "kinderzimmer"
                },
                {
                    "pitch": 1.5,
                    "yaw": -101,
                    "type": "scene",
                    "text": "Zum Bad",
                    "sceneId": "bad"
                }
            ]
        },

        "schlafzimmer": {
            "title": "Schlafzimmer",
            "type": "equirectangular",
            "panorama": "images/rundgang_schlafzimmer.jpg",
            "hotSpots": [
                {
                    "pitch": 1.06,
                    "yaw": -154,
                    "type": "scene",
                    "text": "Zurück ins Wohnzimmer",
                    "sceneId": "wohnzimmer"
                }
            ]
        },

        "kinderzimmer": {
            "title": "Kinderzimmer",
            "type": "equirectangular",
            "panorama": "images/rundgang_kinderzimmer.jpg",
            "hotSpots": [
                {
                    "pitch": 6.7,
                    "yaw": -163,
                    "type": "scene",
                    "text": "Zurück ins Wohnzimmer",
                    "sceneId": "wohnzimmer"
                }
            ]
        },

        "bad": {
            "title": "Bad",
            "type": "equirectangular",
            "panorama": "images/rundgang_bad.jpg",
            "pitch": -16,
            "yaw": 161,
            "hotSpots": [
                {
                    "pitch": -19,
                    "yaw": -178,
                    "type": "scene",
                    "text": "Zurück ins Wohnzimmer",
                    "sceneId": "wohnzimmer"
                }
            ]
        }
    }
});
// Click-Event für Koordinaten (Mouseup verhindert Konflikte mit dem Ziehen/Drehen):
myViewer.on('mouseup', function(event) {
    // Wandelt Pixel-Koordinaten des Mauszeigers in Pitch & Yaw um
    const coords = myViewer.mouseEventToCoords(event);
    const pitch = coords[0].toFixed(2);
    const yaw = coords[1].toFixed(2);

    const hotspotSnippet = `{\n  "pitch": ${pitch},\n  "yaw": ${yaw},\n  "type": "scene",\n  "text": "Neuer Ort",\n  "sceneId": "ziel_szene"\n},`;

    console.log(`%c📍 Hotspot-Koordinaten erfasst:`, 'color: #007aff; font-weight: bold;');
    console.log(hotspotSnippet);

    // Optional: Kopiert den fertigen Block direkt in deine Mac-Zwischenablage
    if (navigator.clipboard) {
        navigator.clipboard.writeText(hotspotSnippet)
            .then(() => console.log('📋 Fertiges JSON direkt in die Zwischenablage kopiert!'))
            .catch(() => {});
    }
});
</script>
