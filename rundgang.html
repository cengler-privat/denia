<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>360° Rundgang – Casa Englers y Amigos</title>

    <!-- Pannellum CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Outfit:wght@300;500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           BASIS & TOUCH-OPTIMIERUNG
           ========================================================= */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.4s ease, color 0.4s ease;
            overscroll-behavior: none;
        }

        /* Design-Umschalter (jetzt unten links, damit oben rechts Platz für den Grundriss ist) */
        .theme-switcher {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
        }

        .theme-switcher select {
            background: #1e293b;
            color: #f59e0b;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 15px;
            font-family: inherit;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        /* Standard-Titel & Autor-Box von Pannellum komplett ausblenden */
        .pnlm-title-box,
        .pnlm-author-box { 
            display: none !important; 
        }

        /* Scrollbalken in den horizontalen Menüs unsichtbar machen */
        .room-nav::-webkit-scrollbar { display: none; }
        .room-nav { -ms-overflow-style: none; scrollbar-width: none; }

        .viewer-wrapper {
            position: relative;
        }

        /* =========================================================
           🗺️ INTERAKTIVER GRUNDRISS & BLICKRICHTUNGS-RADAR (OBEN RECHTS)
           ========================================================= */
        .floorplan-card {
            position: absolute;
            top: 22px;
            right: 22px;
            z-index: 30;
            width: 220px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.45);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .floorplan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .fp-toggle-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .fp-toggle-btn:hover {
            background: #f59e0b;
            color: #000;
        }

        /* Eingeklappter Zustand des Grundrisses */
        .floorplan-card.collapsed {
            width: auto;
            padding: 8px 12px;
            border-radius: 30px;
        }
        .floorplan-card.collapsed .floorplan-svg {
            display: none;
        }
        .floorplan-card.collapsed .floorplan-header {
            margin-bottom: 0;
            gap: 8px;
        }

        .floorplan-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Räume im SVG-Grundriss */
        .fp-room {
            fill: rgba(255, 255, 255, 0.06);
            stroke: rgba(255, 255, 255, 0.35);
            stroke-width: 1.8;
            cursor: pointer;
            transition: fill 0.25s ease, stroke 0.25s ease;
        }

        .fp-room:hover {
            fill: rgba(245, 158, 11, 0.22);
            stroke: rgba(245, 158, 11, 0.8);
        }

        .fp-room.active {
            fill: rgba(245, 158, 11, 0.16);
            stroke: #f59e0b;
            stroke-width: 2.2;
        }

        .fp-label {
            fill: rgba(255, 255, 255, 0.7);
            font-family: 'Outfit', sans-serif;
            font-size: 8.5px;
            font-weight: 500;
            text-anchor: middle;
            pointer-events: none;
        }

        /* Standort-Punkte auf dem Grundriss */
        .fp-node {
            fill: rgba(255, 255, 255, 0.8);
            stroke: #0f172a;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .fp-node:hover {
            r: 7;
            fill: #f59e0b;
        }

        .fp-node.active {
            fill: #f59e0b;
            stroke: #ffffff;
            stroke-width: 2.5;
            r: 6.5;
        }

        /* Der Blickrichtungs-Radar-Kegel */
        #radar-group {
            pointer-events: none;
            transition: transform 0.08s linear;
        }

        /* =========================================================
           DESIGN 1: CINEMATIC GLASSMORPHISM (Vollbild)
           ========================================================= */
        body.theme-glass {
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: #000;
        }

        body.theme-glass .tour-layout {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        body.theme-glass .tour-header {
            position: absolute;
            top: 22px;
            left: 22px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 16px 26px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            pointer-events: none;
        }

        body.theme-glass .eyebrow {
            font-size: 11px;
            letter-spacing: 2px;
            color: #f59e0b;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        body.theme-glass .tour-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        body.theme-glass .tour-desc { display: none; }

        body.theme-glass .room-nav {
            position: absolute;
            bottom: max(25px, env(safe-area-inset-bottom, 25px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.45);
            max-width: 94vw;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        body.theme-glass .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            padding: 10px 18px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        body.theme-glass .nav-btn .num { display: none; }

        body.theme-glass .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        body.theme-glass .nav-btn.active {
            background: #f59e0b;
            color: #000;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        body.theme-glass .viewer-wrapper,
        body.theme-glass #panorama {
            width: 100%;
            height: 100%;
        }

        /* =========================================================
           DESIGN 2: BOUTIQUE RESORT MAGAZIN (Warmes Editorial)
           ========================================================= */
        body.theme-editorial {
            background-color: #f4EFE6;
            color: #2C2523;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 40px;
        }

        body.theme-editorial .tour-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 45px;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        body.theme-editorial .eyebrow {
            font-size: 12px;
            letter-spacing: 3px;
            color: #C86D51;
            font-weight: 600;
            display: block;
        }

        body.theme-editorial .tour-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 52px;
            line-height: 1.05;
            margin: 10px 0 18px 0;
            color: #1a1615;
        }

        body.theme-editorial .tour-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #6E655F;
            margin-bottom: 28px;
        }

        body.theme-editorial .room-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        body.theme-editorial .nav-btn {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(44, 37, 35, 0.1);
            padding: 14px 18px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
            font-family: inherit;
            font-size: 15px;
            color: #2C2523;
            white-space: nowrap;
            flex-shrink: 0;
        }

        body.theme-editorial .nav-btn .num {
            font-size: 12px;
            color: #C86D51;
            font-weight: 700;
        }

        body.theme-editorial .nav-btn:hover {
            border-color: #C86D51;
            transform: translateX(5px);
            background: #fff;
        }

        body.theme-editorial .nav-btn.active {
            background: #2C2523;
            color: #f4EFE6;
            border-color: #2C2523;
        }

        body.theme-editorial #panorama {
            width: 100%;
            height: 760px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(44, 37, 35, 0.25);
            border: 6px solid #fff;
        }

        /* =========================================================
           DESIGN 3: AMBIENT DARK MODE (Kino-Leuchteffekt)
           ========================================================= */
        body.theme-ambient {
            background-color: #090b10;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            padding: 35px 25px;
        }

        body.theme-ambient .tour-layout {
            max-width: 1280px;
            margin: 0 auto;
            text-align: center;
        }

        body.theme-ambient .eyebrow {
            font-size: 12px;
            letter-spacing: 4px;
            color: #fbbf24;
            display: block;
            margin-bottom: 6px;
        }

        body.theme-ambient .tour-header h1 {
            font-weight: 300;
            letter-spacing: 5px;
            font-size: 32px;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #fbbf24, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.theme-ambient .tour-desc { display: none; }

        body.theme-ambient .room-nav {
            display: inline-flex;
            background: #161b26;
            padding: 6px;
            border-radius: 40px;
            border: 1px solid #262f40;
            margin-bottom: 30px;
            gap: 6px;
            max-width: 100%;
            overflow-x: auto;
        }

        body.theme-ambient .nav-btn {
            background: transparent;
            border: none;
            color: #8b9bb4;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        body.theme-ambient .nav-btn .num { display: none; }

        body.theme-ambient .nav-btn.active,
        body.theme-ambient .nav-btn:hover {
            background: #262f40;
            color: #fbbf24;
        }

        body.theme-ambient .viewer-wrapper {
            position: relative;
            border-radius: 24px;
            padding: 4px;
            background: linear-gradient(135deg, rgba(251,191,36,0.45), rgba(255,255,255,0.05), rgba(56,189,248,0.35));
            box-shadow: 0 0 90px -10px rgba(251, 191, 36, 0.28);
        }

        body.theme-ambient #panorama {
            width: 100%;
            height: 720px;
            border-radius: 20px;
            overflow: hidden;
        }

        /* =========================================================
           CUSTOM HOTSPOT STYLING
           ========================================================= */
        .custom-hotspot {
            height: 30px;
            width: 30px;
            background: rgba(245, 158, 11, 0.95);
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .custom-hotspot:hover {
            transform: scale(1.25);
            background: #ffffff;
            border-color: #f59e0b;
        }

        .pulse-effect::after {
            content: '';
            position: absolute;
            top: -7px; left: -7px; right: -7px; bottom: -7px;
            border: 2px solid #f59e0b;
            border-radius: 50%;
            animation: pulseRing 2s infinite ease-out;
            pointer-events: none;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* =========================================================
           📱 SMARTPHONE HOCHKANT (PORTRAIT) OPTIMIERUNG
           ========================================================= */
        @media (max-width: 768px) {
            /* Grundriss oben rechts kompakter machen */
            .floorplan-card {
                top: max(12px, env(safe-area-inset-top, 12px));
                right: 12px;
                width: 155px;
                padding: 8px;
                border-radius: 16px;
            }
            .floorplan-header {
                font-size: 9px;
                margin-bottom: 5px;
            }

            /* Stil-Umschalter oben über die Zoom-Controls oder dezent unten */
            .theme-switcher {
                bottom: auto;
                top: 78px;
                left: 12px;
                padding: 4px 8px;
                font-size: 11px;
            }
            .theme-switcher span { display: none; }
            .theme-switcher select { font-size: 11px; padding: 2px 6px; }

            .custom-hotspot {
                width: 36px;
                height: 36px;
            }

            .pnlm-controls-container {
                top: 118px !important;
                left: 12px !important;
            }

            .pnlm-compass {
                bottom: 85px !important;
                right: 14px !important;
                transform: scale(0.85);
            }

            /* --- 1. GLASSMORPHISM AUF SMARTPHONE HOCHKANT --- */
            body.theme-glass .tour-header {
                top: max(12px, env(safe-area-inset-top, 12px));
                left: 12px;
                right: 175px; /* Platz lassen für den Grundriss rechts */
                padding: 10px 14px;
                border-radius: 14px;
            }
            body.theme-glass .eyebrow {
                font-size: 9px;
                letter-spacing: 1.5px;
            }
            body.theme-glass .tour-header h1 {
                font-size: 15px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            body.theme-glass .room-nav {
                bottom: max(16px, env(safe-area-inset-bottom, 16px));
                width: calc(100vw - 24px);
                justify-content: flex-start;
                padding: 6px;
                border-radius: 30px;
                scroll-snap-type: x mandatory;
            }
            body.theme-glass .nav-btn {
                padding: 10px 15px;
                font-size: 13px;
                scroll-snap-align: center;
            }

            /* --- 2. BOUTIQUE MAGAZIN AUF SMARTPHONE HOCHKANT --- */
            body.theme-editorial {
                padding: 16px 14px 24px 14px;
            }
            body.theme-editorial .tour-layout {
                display: flex;
                flex-direction: column;
                gap: 14px;
                min-height: calc(100dvh - 40px);
            }
            body.theme-editorial .tour-sidebar {
                width: 100%;
            }
            body.theme-editorial .eyebrow {
                font-size: 10px;
            }
            body.theme-editorial .tour-header h1 {
                font-size: 28px;
                margin: 4px 0 8px 0;
            }
            body.theme-editorial .tour-desc {
                display: none;
            }
            body.theme-editorial .room-nav {
                flex-direction: row;
                overflow-x: auto;
                gap: 8px;
                padding-bottom: 4px;
                scroll-snap-type: x mandatory;
            }
            body.theme-editorial .nav-btn {
                padding: 10px 14px;
                font-size: 13px;
                border-radius: 25px;
                scroll-snap-align: center;
            }
            body.theme-editorial .nav-btn:hover {
                transform: none;
            }
            body.theme-editorial .viewer-wrapper {
                width: 100%;
                flex: 1;
                display: flex;
            }
            body.theme-editorial #panorama {
                height: 68dvh;
                min-height: 420px;
                border-radius: 22px;
                border-width: 4px;
            }

            /* --- 3. AMBIENT KINO AUF SMARTPHONE HOCHKANT --- */
            body.theme-ambient {
                padding: 16px 12px 24px 12px;
            }
            body.theme-ambient .tour-header {
                text-align: left;
            }
            body.theme-ambient .eyebrow {
                font-size: 9px;
                letter-spacing: 2px;
            }
            body.theme-ambient .tour-header h1 {
                font-size: 18px;
                letter-spacing: 2px;
                margin-bottom: 12px;
            }
            body.theme-ambient .room-nav {
                display: flex;
                justify-content: flex-start;
                width: 100%;
                margin-bottom: 14px;
                padding: 5px;
                scroll-snap-type: x mandatory;
            }
            body.theme-ambient .nav-btn {
                padding: 9px 14px;
                font-size: 13px;
                scroll-snap-align: center;
            }
            body.theme-ambient #panorama {
                height: 70dvh;
                min-height: 430px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body class="theme-glass">

    <!-- LIVE DESIGN-UMSCHALTER -->
    <div class="theme-switcher">
        <span>🎨 Stil:</span>
        <select onchange="changeTheme(this.value)">
            <option value="theme-glass">1. Glassmorphism</option>
            <option value="theme-editorial">2. Boutique Magazin</option>
            <option value="theme-ambient">3. Ambient Kino</option>
        </select>
    </div>

    <div class="tour-layout">
        <!-- Seitenleiste / Header + Navigation -->
        <aside class="tour-sidebar">
            <header class="tour-header">
                <span class="eyebrow">360° VIRTUELLER RUNDGANG</span>
                <h1>Casa Englers y Amigos</h1>
                <p class="tour-desc">
                    Erkunde unser Ferienhaus bequem von zu Hause aus. Nutze die Maus zum Umschauen oder wähle direkt einen Raum:
                </p>
            </header>

            <nav class="room-nav">
                <button class="nav-btn active" onclick="loadRoom('terrasse', this)">
                    <span class="num">01</span> ☀️ Terrasse
                </button>
                <button class="nav-btn" onclick="loadRoom('wohnzimmer', this)">
                    <span class="num">02</span> 🛋️ Wohnzimmer
                </button>
                <button class="nav-btn" onclick="loadRoom('schlafzimmer', this)">
                    <span class="num">03</span> 🛏️ Schlafzimmer
                </button>
                <button class="nav-btn" onclick="loadRoom('kinderzimmer', this)">
                    <span class="num">04</span> 🧸 Kinderzimmer
                </button>
                <button class="nav-btn" onclick="loadRoom('bad', this)">
                    <span class="num">05</span> 🚿 Bad
                </button>
                <button class="nav-btn" onclick="loadRoom('rueckseite', this)">
                    <span class="num">06</span> 🌅 Rückseite
                </button>
            </nav>
        </aside>

        <!-- Panorama Viewer + Interaktiver Grundriss oben rechts -->
        <main class="viewer-wrapper">
            
            <!-- 🗺️ INTERAKTIVER GRUNDRISS MIT LIVE-RADAR (OBEN RECHTS) -->
            <div class="floorplan-card" id="floorplanCard">
                <div class="floorplan-header">
                    <span>🗺️ Grundriss</span>
                    <button class="fp-toggle-btn" onclick="toggleFloorplan()" title="Grundriss ein-/ausklappen">−</button>
                </div>

                <svg class="floorplan-svg" viewBox="0 0 220 245">
                    <defs>
                        <!-- Sanfter Farbverlauf für den Radar-Sichtkegel -->
                        <radialGradient id="radarBeamGrad" cx="0" cy="0" r="65" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"/>
                            <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
                        </radialGradient>
                    </defs>

                    <!-- RÄUME (Klickbar) -->
                    <!-- 06 Rückseite / Terrasse West (Oben) -->
                    <rect id="room-rueckseite" class="fp-room" x="15" y="10" width="190" height="36" rx="6" onclick="loadRoom('rueckseite')" />
                    <text x="110" y="31" class="fp-label">Rückseite (West)</text>

                    <!-- 03 Schlafzimmer (Mitte Links) -->
                    <rect id="room-schlafzimmer" class="fp-room" x="15" y="52" width="60" height="65" rx="4" onclick="loadRoom('schlafzimmer')" />
                    <text x="45" y="75" class="fp-label">Schlafz.</text>

                    <!-- 04 Kinderzimmer (Unten Links) -->
                    <rect id="room-kinderzimmer" class="fp-room" x="15" y="121" width="60" height="58" rx="4" onclick="loadRoom('kinderzimmer')" />
                    <text x="45" y="142" class="fp-label">Kinderz.</text>

                    <!-- 02 Wohnzimmer (Zentral) -->
                    <rect id="room-wohnzimmer" class="fp-room" x="79" y="52" width="76" height="127" rx="4" onclick="loadRoom('wohnzimmer')" />
                    <text x="117" y="102" class="fp-label">Wohnzimmer</text>

                    <!-- 05 Bad (Rechts) -->
                    <rect id="room-bad" class="fp-room" x="159" y="52" width="46" height="65" rx="4" onclick="loadRoom('bad')" />
                    <text x="182" y="75" class="fp-label">Bad</text>

                    <!-- 01 Sonnenterrasse (Unten) -->
                    <rect id="room-terrasse" class="fp-room active" x="15" y="185" width="190" height="48" rx="6" onclick="loadRoom('terrasse')" />
                    <text x="110" y="224" class="fp-label">Sonnenterrasse</text>

                    <!-- 📡 BLICKRICHTUNGS-RADAR (Sichtkegel) -->
                    <g id="radar-group" transform="translate(117, 205)">
                        <path id="radar-cone" d="M 0,0 L -32,-52 A 60,60 0 0,1 32,-52 Z" fill="url(#radarBeamGrad)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1" />
                    </g>

                    <!-- 📍 KAMERA-STANDORT-PUNKTE (Klickbar) -->
                    <circle id="node-rueckseite" class="fp-node" cx="110" cy="28" r="5" onclick="loadRoom('rueckseite')">
                        <title>Rückseite</title>
                    </circle>
                    <circle id="node-schlafzimmer" class="fp-node" cx="45" cy="92" r="5" onclick="loadRoom('schlafzimmer')">
                        <title>Schlafzimmer</title>
                    </circle>
                    <circle id="node-kinderzimmer" class="fp-node" cx="45" cy="156" r="5" onclick="loadRoom('kinderzimmer')">
                        <title>Kinderzimmer</title>
                    </circle>
                    <circle id="node-wohnzimmer" class="fp-node" cx="117" cy="118" r="5" onclick="loadRoom('wohnzimmer')">
                        <title>Wohnzimmer</title>
                    </circle>
                    <circle id="node-bad" class="fp-node" cx="182" cy="92" r="5" onclick="loadRoom('bad')">
                        <title>Bad</title>
                    </circle>
                    <circle id="node-terrasse" class="fp-node active" cx="117" cy="205" r="6" onclick="loadRoom('terrasse')">
                        <title>Terrasse</title>
                    </circle>
                </svg>
            </div>

            <div id="panorama"></div>
        </main>
    </div>

    <script>
        const isMobilePortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;

        // =========================================================================
        // 🗺️ KOORDINATEN & NORD-AUSRICHTUNG DER RÄUME AUF DEM GRUNDRISS
        // x, y = Position im SVG | offset = Dreh-Korrektur des Radars falls nötig
        // =========================================================================
        const floorplanNodes = {
            "terrasse":     { x: 117, y: 205, offset: 0 },
            "wohnzimmer":   { x: 117, y: 118, offset: 180 },
            "schlafzimmer": { x: 45,  y: 92,  offset: 90 },
            "kinderzimmer": { x: 45,  y: 156, offset: 90 },
            "bad":          { x: 182, y: 92,  offset: -90 },
            "rueckseite":   { x: 110, y: 28,  offset: 180 }
        };

        const myViewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "terrasse",
                "sceneFadeDuration": 1200,
                "autoLoad": true,
                "autoRotate": -2,
                "compass": true,
                "northOffset": -67,
                "hfov": isMobilePortrait ? 80 : 100,
                "minHfov": 50,
                "maxHfov": 120
            },

            "scenes": {
                "terrasse": {
                    "title": "Terrasse",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_terrasse.jpg",
                    "hotSpots": [
                        {
                            "pitch": -5.40,
                            "yaw": 112.30,
                            "type": "info",
                            "text": "Eingangsbereich / Rezeption"
                        },       
                        {
                            "pitch": -1.27,
                            "yaw": 170.62,
                            "type": "scene",
                            "text": "Neuer Ort",
                            "sceneId": "wohnzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        },     
                        {
                            "pitch": -6,
                            "yaw": -140,
                            "type": "scene",
                            "text": "Ins Wohnzimmer gehen",
                            "sceneId": "wohnzimmer"
                        }
                    ]
                },

                "wohnzimmer": {
                    "title": "Wohnzimmer",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_wohnzimmer.jpg",
                    "hotSpots": [
                        {
                            "pitch": 0,
                            "yaw": 0,
                            "type": "scene",
                            "text": "Zurück zur Terrasse",
                            "sceneId": "terrasse"
                        },
                        {
                            "pitch": -3.8,
                            "yaw": -30,
                            "type": "scene",
                            "text": "Zum Schlafzimmer",
                            "sceneId": "schlafzimmer"
                        },
                        {
                            "pitch": 1.10,
                            "yaw": -87,
                            "type": "scene",
                            "text": "Zum Kinderzimmer",
                            "sceneId": "kinderzimmer"
                        },
                        {
                            "pitch": 1.5,
                            "yaw": -101,
                            "type": "scene",
                            "text": "Zum Bad",
                            "sceneId": "bad"
                        }
                    ]
                },

                "schlafzimmer": {
                    "title": "Schlafzimmer",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_schlafzimmer.jpg",
                    "hotSpots": [
                        {
                            "pitch": 1.06,
                            "yaw": -154,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer"
                        }
                    ]
                },

                "kinderzimmer": {
                    "title": "Kinderzimmer",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_kinderzimmer.jpg",
                    "hotSpots": [
                        {
                            "pitch": 6.7,
                            "yaw": -163,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer"
                        }
                    ]
                },

                "bad": {
                    "title": "Bad",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_bad.jpg",
                    "pitch": -16,
                    "yaw": 161,
                    "hotSpots": [
                        {
                            "pitch": -19,
                            "yaw": -178,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer"
                        }
                    ]
                },

                "rueckseite": {
                    "title": "Rückseite",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_terrasse_west.jpg",
                    "hotSpots": [
                        {
                            "pitch": 0,
                            "yaw": 0,
                            "type": "scene",
                            "text": "Zurück zur Terrasse",
                            "sceneId": "terrasse"
                        }
                    ]
                }
            }
        });

        // Raum über Buttons oder Grundriss wechseln
        function loadRoom(sceneId, btnElement) {
            myViewer.loadScene(sceneId);
            syncNavigationUI(sceneId);
        }

        // Synchronisiert die untere Button-Leiste UND die Räume/Punkte im Grundriss
        function syncNavigationUI(sceneId) {
            // 1. Buttons in der Leiste aktualisieren
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const isTarget = btn.getAttribute('onclick').includes(`'${sceneId}'`);
                btn.classList.toggle('active', isTarget);
                if (isTarget) {
                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });

            // 2. Grundriss-Räume & Punkte hervorheben
            document.querySelectorAll('.fp-room').forEach(r => r.classList.remove('active'));
            document.querySelectorAll('.fp-node').forEach(n => n.classList.remove('active'));

            const activeRoom = document.getElementById(`room-${sceneId}`);
            const activeNode = document.getElementById(`node-${sceneId}`);
            if (activeRoom) activeRoom.classList.add('active');
            if (activeNode) activeNode.classList.add('active');
        }

        // Wenn im Panorama auf einen Hotspot geklickt wird -> UI und Grundriss automatisch mitwechseln
        myViewer.on('scenechange', function(sceneId) {
            syncNavigationUI(sceneId);
        });

        // =========================================================================
        // 📡 ECHTZEIT-RADAR-ANIMATION (60 FPS Loop für Drehung & Zoom-Winkel)
        // =========================================================================
        const radarGroup = document.getElementById('radar-group');
        const radarCone = document.getElementById('radar-cone');

        function updateRadar() {
            const currentScene = myViewer.getScene();
            const node = floorplanNodes[currentScene] || floorplanNodes['terrasse'];
            
            // Aktuelle Blickrichtung (Yaw) und Zoom (HFOV) aus Pannellum holen
            const yaw = myViewer.getYaw() || 0;
            const hfov = myViewer.getHfov() || 100;

            // Kegel-Position & Rotation auf dem Grundriss setzen
            const angle = yaw + (node.offset || 0);
            radarGroup.setAttribute('transform', `translate(${node.x}, ${node.y}) rotate(${angle})`);

            // Kegel-Breite dynamisch an den aktuellen Zoomfaktor (HFOV) anpassen
            const radius = 58;
            const halfAngleRad = (Math.min(Math.max(hfov, 40), 120) / 2) * (Math.PI / 180);
            const xSpread = (Math.sin(halfAngleRad) * radius).toFixed(1);
            const ySpread = (-Math.cos(halfAngleRad) * radius).toFixed(1);
            
            radarCone.setAttribute('d', `M 0,0 L ${-xSpread},${ySpread} A ${radius},${radius} 0 0,1 ${xSpread},${ySpread} Z`);

            requestAnimationFrame(updateRadar);
        }
        requestAnimationFrame(updateRadar);

        // Grundriss ein-/ausklappen (besonders praktisch auf dem Smartphone)
        function toggleFloorplan() {
            const card = document.getElementById('floorplanCard');
            const btn = card.querySelector('.fp-toggle-btn');
            card.classList.toggle('collapsed');
            btn.textContent = card.classList.contains('collapsed') ? '+' : '−';
        }

        // Design-Umschalter Funktion
        function changeTheme(themeClass) {
            document.body.className = themeClass;
            setTimeout(() => {
                myViewer.resize();
            }, 60);
        }

        // Bei Drehung des Smartphones Viewer anpassen
        window.addEventListener('resize', () => {
            myViewer.resize();
        });

        // Click-Event für Hotspot-Koordinaten in der Konsole & Zwischenablage
        myViewer.on('mouseup', function(event) {
            const coords = myViewer.mouseEventToCoords(event);
            if (!coords || isNaN(coords[0])) return;
            const pitch = coords[0].toFixed(2);
            const yaw = coords[1].toFixed(2);

            const hotspotSnippet = `{\n  "pitch": ${pitch},\n  "yaw": ${yaw},\n  "type": "scene",\n  "text": "Neuer Ort",\n  "sceneId": "ziel_szene"\n},`;

            console.log(`%c📍 Hotspot-Koordinaten erfasst:`, 'color: #007aff; font-weight: bold;');
            console.log(hotspotSnippet);

            if (navigator.clipboard) {
                navigator.clipboard.writeText(hotspotSnippet)
                    .then(() => console.log('📋 Fertiges JSON direkt in die Zwischenablage kopiert!'))
                    .catch(() => {});
            }
        });
    </script>
</body>
</html>
