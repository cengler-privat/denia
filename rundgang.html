<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>360° Rundgang – Casa Englers y Amigos</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Pannellum 360° Viewer CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        .tour-page-header {
            text-align: center;
            padding: 85px 20px 15px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .tour-page-header .eyebrow {
            font-family: 'Lato', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #d97706;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }

        .tour-page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            margin: 0 0 10px 0;
        }

        .tour-page-header p {
            font-family: 'Lato', sans-serif;
            font-size: 1.05rem;
            opacity: 0.85;
            margin: 0 auto;
            max-width: 650px;
            line-height: 1.5;
        }

        .tour-section-container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 10px 20px 40px 20px;
        }

        .viewer-stage {
            position: relative;
            width: 100%;
            height: 78vh;
            min-height: 540px;
            max-height: 850px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            border: 5px solid #ffffff;
            background: #000;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        .pnlm-title-box,
        .pnlm-author-box {
            display: none !important;
        }

        /* =========================================================
           ✨ DEZENTES GLASSMORPHISM-DESIGN FÜR PANNELLUM BUTTONS & KOMPASS
           ========================================================= */
        .pnlm-controls-container {
            top: 18px !important;
            left: 18px !important;
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 14px !important;
            padding: 4px !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25) !important;
        }

        /* Zwingt den Hintergrund der einzelnen Buttons im Container komplett weg */
        .pnlm-controls-container div.pnlm-button {
            background-color: transparent !important;
            background-image: none !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* Färbt die Icons (Pfeile/Symbole) hell, damit sie auf dem dunklen Glas lesbar sind */
        .pnlm-controls-container .pnlm-button {
            filter: invert(1) grayscale(100%) brightness(200%);
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .pnlm-controls-container .pnlm-button:hover {
            opacity: 1;
        }

        .pnlm-button:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.15) !important;
        }

        .pnlm-compass {
            bottom: 20px !important;
            right: 20px !important;
            z-index: 100 !important; /* Zwingt den Kompass ganz nach vorne */
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 50% !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25) !important;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .pnlm-compass:hover {
            opacity: 1;
        }

        /* =========================================================
           🗺️ INTERAKTIVER GRUNDRISS
           ========================================================= */
        .floorplan-card {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 30;
            width: 215px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .floorplan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
            color: rgba(255, 255, 255, 0.95);
            font-family: 'Lato', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .fp-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .fp-toggle-btn:hover {
            background: #f59e0b;
            color: #000;
        }

        .floorplan-card.collapsed {
            width: auto;
            padding: 8px 14px;
            border-radius: 30px;
        }

        .floorplan-card.collapsed .floorplan-svg {
            display: none;
        }

        .floorplan-card.collapsed .floorplan-header {
            margin-bottom: 0;
            gap: 10px;
        }

        .floorplan-svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .fp-room {
            fill: rgba(255, 255, 255, 0.06);
            stroke: rgba(255, 255, 255, 0.35);
            stroke-width: 1.8;
            cursor: pointer;
            transition: fill 0.25s ease, stroke 0.25s ease;
        }

        .fp-room:hover {
            fill: rgba(245, 158, 11, 0.22);
            stroke: rgba(245, 158, 11, 0.8);
        }

        .fp-room.active {
            fill: rgba(245, 158, 11, 0.18);
            stroke: #f59e0b;
            stroke-width: 2.2;
        }

        .fp-label {
            fill: rgba(255, 255, 255, 0.78);
            font-family: 'Lato', sans-serif;
            font-size: 8.5px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
        }

        .fp-node {
            fill: rgba(255, 255, 255, 0.85);
            stroke: #0f172a;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .fp-node:hover {
            r: 7;
            fill: #f59e0b;
        }

        .fp-node.active {
            fill: #f59e0b;
            stroke: #ffffff;
            stroke-width: 2.5;
            r: 6.5;
        }

        #radar-group {
            pointer-events: none;
            transition: transform 0.08s linear;
        }

        .custom-hotspot {
            height: 30px;
            width: 30px;
            background: rgba(245, 158, 11, 0.95);
            border: 3px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .custom-hotspot:hover {
            transform: scale(1.25);
            background: #ffffff;
            border-color: #f59e0b;
        }

        .pulse-effect::after {
            content: '';
            position: absolute;
            top: -7px; left: -7px; right: -7px; bottom: -7px;
            border: 2px solid #f59e0b;
            border-radius: 50%;
            animation: pulseRing 2s infinite ease-out;
            pointer-events: none;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        @media (max-width: 768px) {
            .tour-page-header {
                padding: 75px 15px 10px 15px;
            }

            .tour-page-header p {
                font-size: 0.95rem;
            }

            .tour-section-container {
                padding: 5px 10px 25px 10px;
            }

            .viewer-stage {
                height: 75dvh;
                min-height: 450px;
                border-radius: 18px;
                border-width: 3px;
            }

            .floorplan-card {
                top: 12px;
                right: 12px;
                width: 150px;
                padding: 8px;
                border-radius: 14px;
            }

            .floorplan-header {
                font-size: 9.5px;
                margin-bottom: 5px;
            }

            .custom-hotspot {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>

<body>

    <button class="burger-menu-button" id="burger-menu-btn" title="Menü öffnen">
        <span class="burger-menu-bar"></span>
        <span class="burger-menu-bar"></span>
        <span class="burger-menu-bar"></span>
    </button>
    
    <div id="menu-container"></div>

    <main class="bg-light">
        <header class="tour-page-header">
            <span class="eyebrow">Virtueller 360° Rundgang</span>
            <h1>Hereinspaziert in die Casa!</h1>
            <p>Schaut euch im Panorama um, nutzt die Hotspots im Bild oder klickt direkt im Grundriss auf den gewünschten Raum.</p>
        </header>

        <section class="tour-section-container">
            <div class="viewer-stage">
                <!-- 🗺️ INTERAKTIVER GRUNDRISS -->
                <div class="floorplan-card" id="floorplanCard">
                    <div class="floorplan-header">
                        <span>🗺️ Grundriss</span>
                        <button class="fp-toggle-btn" onclick="toggleFloorplan()" title="Grundriss ein-/ausklappen">−</button>
                    </div>

                    <svg class="floorplan-svg" viewBox="0 0 220 245">
                        <defs>
                            <radialGradient id="radarBeamGrad" cx="0" cy="0" r="65" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
                                <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.25"/>
                                <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
                            </radialGradient>
                        </defs>

                        <rect id="room-rueckseite" class="fp-room" x="15" y="10" width="190" height="36" rx="6" onclick="loadRoom('rueckseite')" />
                        <text x="110" y="31" class="fp-label">Wohnungseingang</text>

                        <rect id="room-bad" class="fp-room" x="15" y="52" width="50" height="127" rx="4" onclick="loadRoom('bad')" />
                        <text x="40" y="118" class="fp-label">Bad</text>

                        <rect id="room-wohnzimmer" class="fp-room" x="69" y="52" width="82" height="127" rx="4" onclick="loadRoom('wohnzimmer')" />
                        <text x="110" y="118" class="fp-label">Wohnzimmer</text>

                        <rect id="room-schlafzimmer" class="fp-room" x="155" y="52" width="50" height="62" rx="4" onclick="loadRoom('schlafzimmer')" />
                        <text x="180" y="85" class="fp-label">Schlafz.</text>

                        <rect id="room-kinderzimmer" class="fp-room" x="155" y="118" width="50" height="61" rx="4" onclick="loadRoom('kinderzimmer')" />
                        <text x="180" y="152" class="fp-label">Kinderz.</text>

                        <rect id="room-terrasse" class="fp-room active" x="15" y="185" width="190" height="48" rx="6" onclick="loadRoom('terrasse')" />
                        <text x="110" y="224" class="fp-label">Sonnent≤errasse</text>

                        <g id="radar-group" transform="translate(110, 205)">
                            <path id="radar-cone" d="M 0,0 L -32,-52 A 60,60 0 0,1 32,-52 Z" fill="url(#radarBeamGrad)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1" />
                        </g>

                        <circle id="node-rueckseite" class="fp-node" cx="110" cy="28" r="5" onclick="loadRoom('rueckseite')"><title>Rückseite</title></circle>
                        <circle id="node-bad" class="fp-node" cx="40" cy="115" r="5" onclick="loadRoom('bad')"><title>Bad</title></circle>
                        <circle id="node-wohnzimmer" class="fp-node" cx="110" cy="115" r="5" onclick="loadRoom('wohnzimmer')"><title>Wohnzimmer</title></circle>
                        <circle id="node-schlafzimmer" class="fp-node" cx="180" cy="83" r="5" onclick="loadRoom('schlafzimmer')"><title>Schlafzimmer</title></circle>
                        <circle id="node-kinderzimmer" class="fp-node" cx="180" cy="148" r="5" onclick="loadRoom('kinderzimmer')"><title>Kinderzimmer</title></circle>
                        <circle id="node-terrasse" class="fp-node active" cx="110" cy="205" r="6" onclick="loadRoom('terrasse')"><title>Terrasse</title></circle>
                    </svg>
                </div>

                <div id="panorama"></div>
            </div>
        </section>
    </main>

    <a href="https://wa.me/491733045695" class="whatsapp-button" target="_blank" id="whatsapp-btn" title="WhatsApp schreiben">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="#ffffff" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.8 0-67.6-9.5-97.2-27.2l-6.7-4-71.7 18.7 19.3-68.6-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z" /></svg>
    </a>

    <button id="scroll-to-top-btn" class="scroll-to-top-button" title="Nach oben scrollen">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="currentColor" d="M246.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L224 109.3 361.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z" /></svg>
    </button>

    <div id="weather-overlay">
        <span id="temperature">--</span>°C
    </div>

    <script src="script.js" defer></script>

    <script>
        const isMobilePortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;

        const floorplanNodes = {
            "terrasse":     { x: 110, y: 205, offset: 180 },
            "wohnzimmer":   { x: 110, y: 115, offset: 0 },
            "schlafzimmer": { x: 180, y: 83,  offset: -90 },
            "kinderzimmer": { x: 180, y: 148, offset: -90 },
            "bad":          { x: 40,  y: 115, offset: 90 },
            "rueckseite":   { x: 110, y: 28,  offset: 0 }
        };

        const myViewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "terrasse",
                "sceneFadeDuration": 1200,
                "autoLoad": true,
                "autoRotate": -2,
                "compass": true,
                "northOffset": -67,
                "hfov": isMobilePortrait ? 80 : 100,
                "minHfov": 50,
                "maxHfov": 120
            },

            "scenes": {
                "terrasse": {
                    "title": "Terrasse",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_terrasse.jpg",
                    "hotSpots": [
                        {
                            "pitch": -18.73,
                            "yaw": 133.49,
                            "type": "scene",
                            "text": "Ins Wohnzimmer",
                            "sceneId": "wohnzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        },     
                    ]
                },

                "wohnzimmer": {
                    "title": "Wohnzimmer",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_wohnzimmer.jpg",
                    "hotSpots": [
                        {
                            "pitch": -0.82,
                            "yaw": 47.16,
                            "type": "scene",
                            "text": "Zurück zur Terrasse",
                            "sceneId": "terrasse",
                            "cssClass": "custom-hotspot pulse-effect"
                        },
                        {
                            "pitch": -3.8,
                            "yaw": -30,
                            "type": "scene",
                            "text": "Zum Schlafzimmer",
                            "sceneId": "schlafzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        },
                        {
                            "pitch": 1.10,
                            "yaw": -87,
                            "type": "scene",
                            "text": "Zum Kinderzimmer",
                            "sceneId": "kinderzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        },
                        {
                            "pitch": 1.5,
                            "yaw": -101,
                            "type": "scene",
                            "text": "Zum Wohnungseingang",
                            "sceneId": "rueckseite",
                            "cssClass": "custom-hotspot pulse-effect"
                        },
                        {
                            "pitch": 2.33,
                            "yaw": -129.42,
                            "type": "scene",
                            "text": "Zum Bad",
                            "sceneId": "bad",
                            "cssClass": "custom-hotspot pulse-effect"
                        }
                    ]
                },

                "schlafzimmer": {
                    "title": "Schlafzimmer",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_schlafzimmer.jpg",
                    "hotSpots": [
                        {
                            "pitch": 1.06,
                            "yaw": -154,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        }
                    ]
                },

                "kinderzimmer": {
                    "title": "Kinderzimmer",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_kinderzimmer.jpg",
                    "hotSpots": [
                        {
                            "pitch": -3.34,
                            "yaw": 110.62,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        }
                    ]
                },
                "bad": {
                    "title": "Bad",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_bad.jpg",
                    "pitch": -16,
                    "yaw": 161,
                    "hotSpots": [
                        {
                            "pitch": -19,
                            "yaw": -178,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        }
                    ]
                },

                "rueckseite": {
                    "title": "Rückseite",
                    "type": "equirectangular",
                    "panorama": "images/rundgang_terrasse_west_abends.jpg",
                    "hotSpots": [
                        {
                            "pitch": -9.37,
                            "yaw": 139.61,
                            "type": "scene",
                            "text": "Zurück ins Wohnzimmer",
                            "sceneId": "wohnzimmer",
                            "cssClass": "custom-hotspot pulse-effect"
                        }
                    ]
                }
            }
        });

        function loadRoom(sceneId, btnElement) {
            myViewer.loadScene(sceneId);
            syncNavigationUI(sceneId);
        }

        function syncNavigationUI(sceneId) {
            document.querySelectorAll('.fp-room').forEach(r => r.classList.remove('active'));
            document.querySelectorAll('.fp-node').forEach(n => n.classList.remove('active'));

            const activeRoom = document.getElementById(`room-${sceneId}`);
            const activeNode = document.getElementById(`node-${sceneId}`);
            if (activeRoom) activeRoom.classList.add('active');
            if (activeNode) activeNode.classList.add('active');
        }

        myViewer.on('scenechange', function(sceneId) {
            syncNavigationUI(sceneId);
        });

        const radarGroup = document.getElementById('radar-group');
        const radarCone = document.getElementById('radar-cone');

        function updateRadar() {
            const currentScene = myViewer.getScene();
            const node = floorplanNodes[currentScene] || floorplanNodes['terrasse'];
            
            const yaw = myViewer.getYaw() || 0;
            const hfov = myViewer.getHfov() || 100;

            const angle = yaw + (node.offset || 0);
            radarGroup.setAttribute('transform', `translate(${node.x}, ${node.y}) rotate(${angle})`);

            const radius = 58;
            const halfAngleRad = (Math.min(Math.max(hfov, 40), 120) / 2) * (Math.PI / 180);
            const xSpread = (Math.sin(halfAngleRad) * radius).toFixed(1);
            const ySpread = (-Math.cos(halfAngleRad) * radius).toFixed(1);
            
            radarCone.setAttribute('d', `M 0,0 L ${-xSpread},${ySpread} A ${radius},${radius} 0 0,1 ${xSpread},${ySpread} Z`);

            requestAnimationFrame(updateRadar);
        }
        requestAnimationFrame(updateRadar);

        function toggleFloorplan() {
            const card = document.getElementById('floorplanCard');
            const btn = card.querySelector('.fp-toggle-btn');
            card.classList.toggle('collapsed');
            btn.textContent = card.classList.contains('collapsed') ? '+' : '−';
        }

        window.addEventListener('resize', () => {
            myViewer.resize();
        });

        myViewer.on('mouseup', function(event) {
            const coords = myViewer.mouseEventToCoords(event);
            if (!coords || isNaN(coords[0])) return;
            const pitch = coords[0].toFixed(2);
            const yaw = coords[1].toFixed(2);

            const hotspotSnippet = `{\n  "pitch": ${pitch},\n  "yaw": ${yaw},\n  "type": "scene",\n  "text": "Neuer Ort",\n  "sceneId": "ziel_szene",\n  "cssClass": "custom-hotspot pulse-effect"\n},`;

            console.log(`%c📍 Hotspot-Koordinaten erfasst:`, 'color: #007aff; font-weight: bold;');
            console.log(hotspotSnippet);

            if (navigator.clipboard) {
                navigator.clipboard.writeText(hotspotSnippet)
                    .then(() => console.log('📋 Fertiges JSON direkt in die Zwischenablage kopiert!'))
                    .catch(() => {});
            }
        });
    </script>
