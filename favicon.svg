<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Hintergrund (leicht abgerundetes Quadrat für mehr Platz) -->
  <rect width="128" height="128" rx="24" fill="#0f172a"/>
  
  <!-- Das schematische Hausdach -->
  <path d="M 64 18 L 100 44 H 28 Z" fill="#f59e0b"/>
  
  <!-- Das Haus/Fenster-Symbol in Orange -->
  <rect x="30" y="43" width="68" height="44" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Der Schriftzug "CASA ENGLER" (moderner, sauberer Sans-Serif-Look) -->
  <text x="64" y="60" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">CASA</text>
  <text x="64" y="78" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">ENGLER</text>
</svg>
